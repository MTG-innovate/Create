<title>Little Steps Care Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600&display=swap">
<style>
/* Layout: phone-first app shell. Sticky name header, one scrolling column of sections, fixed bottom tab bar. */
/* Layout: phone-first app shell. Warm photo hero on Today, one scrolling column of sections, fixed bottom tab bar. */
:root{
  --bg:#FFF8F1; --surface:#FFFFFF; --sunk:#FCEEE1; --ink:#3A2A20; --muted:#7A6354; --line:#F0DCCB;
  --accent:#F4B33F; --accent-ink:#3A2A20; --accent-soft:#FFF0D2; --accent-text:#A3610A;
  --hero1:#FFE2CC; --hero2:#FFF1C6; --ring:#FFFFFF;
  --feed:#E2763F; --diaper:#5E9E5A; --sleep:#8A78C6; --exercise:#2F9C92; --weight:#D35E89; --med:#A8569C; --sky:#E4F1FB; --lav:#EFEAFB; --nurse:#3F8CC7; --note:#958171;
  --danger:#C23B30; --ok:#3E8E54;
  --display:"Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D1612; --surface:#271E18; --sunk:#32271F; --ink:#F7EBE1; --muted:#C4AE9D; --line:#423429;
    --accent:#F6BE57; --accent-ink:#2A1E14; --accent-soft:#3B2D1B; --accent-text:#F6BE57;
    --hero1:#3A2619; --hero2:#3A3018; --ring:#271E18;
    --feed:#F09A68; --diaper:#93C98D; --sleep:#B5A8EC; --exercise:#62C7BC; --weight:#EE93B3; --med:#E2A2D9; --sky:#1C2A36; --lav:#272238; --nurse:#7DB7E6; --note:#B9A797;
    --danger:#F48C82; --ok:#86CF98; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1D1612; --surface:#271E18; --sunk:#32271F; --ink:#F7EBE1; --muted:#C4AE9D; --line:#423429;
    --accent:#F6BE57; --accent-ink:#2A1E14; --accent-soft:#3B2D1B; --accent-text:#F6BE57;
    --hero1:#3A2619; --hero2:#3A3018; --ring:#271E18;
    --feed:#F09A68; --diaper:#93C98D; --sleep:#B5A8EC; --exercise:#62C7BC; --weight:#EE93B3; --med:#E2A2D9; --sky:#1C2A36; --lav:#272238; --nurse:#7DB7E6; --note:#B9A797;
    --danger:#F48C82; --ok:#86CF98; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:radial-gradient(60rem 30rem at -10% -5%,var(--hero1),transparent 60%),radial-gradient(40rem 30rem at 110% 20%,var(--accent-soft),transparent 60%),radial-gradient(40rem 30rem at 50% 110%,var(--lav),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent-text);outline-offset:2px}

.band{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:640px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
header.top .inner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 12px}
.babyname{font-family:var(--display);font-weight:600;font-size:1.4rem;line-height:1.1;margin:0;text-wrap:balance;min-width:0;overflow-wrap:anywhere}
.datechip{color:var(--muted);font-size:.9rem;white-space:nowrap;font-variant-numeric:tabular-nums}
main.band .inner{display:flex;flex-direction:column;gap:22px;padding-block:18px calc(104px + env(safe-area-inset-bottom,0px))}

section{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
h2{font-family:var(--display);font-weight:600;font-size:1.25rem;margin:0;text-wrap:balance}
h3{margin:0;font-size:1rem}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.875rem}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 3px 14px rgba(140,80,30,.06)}
.card.list{overflow:hidden}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line);min-width:0;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.row:first-child{border-top:0}
button.row{cursor:pointer}
button.row:hover{background:var(--sunk)}
.row .main{flex:1;min-width:0}
.row .title{font-weight:700;overflow-wrap:anywhere}
.row .sub{color:var(--muted);font-size:.875rem;overflow-wrap:anywhere}
.row .side{color:var(--muted);font-size:.875rem;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.stripe{width:4px;align-self:stretch;border-radius:4px;flex:none}

.datebox{flex:none;width:52px;text-align:center;border-radius:12px;background:var(--accent-soft);padding:6px 0;line-height:1.1}
.datebox b{display:block;font-family:var(--display);font-weight:600;font-size:1.35rem;color:var(--accent-text)}
.datebox span{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer;min-height:40px}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{min-height:34px;padding:5px 12px;font-size:.875rem}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.danger.armed{background:var(--danger);color:var(--surface)}
.icon-btn{border:0;background:var(--sunk);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1.3rem;line-height:1;flex:none}

.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.8rem;font-weight:700;min-width:0}
.quick button:hover{background:var(--sunk)}
.quick button i{width:12px;height:12px;border-radius:50%}
.quick button span{overflow-wrap:anywhere;text-align:center}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.stat{background:var(--surface);padding:12px 14px;min-width:0}
.stat .k{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat .v{font-family:var(--display);font-weight:600;font-size:1.45rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .d{font-size:.8rem;color:var(--muted)}

.empty{padding:18px 16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty p{margin:0;color:var(--muted);max-width:52ch}

.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.check:first-child{border-top:0}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent-text);flex:none}
.check .main{flex:1;min-width:0}
.check.done .title{text-decoration:line-through;color:var(--muted)}

.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer;color:var(--muted);font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav .lbl{font-weight:700;text-align:center;flex:1}

.chart{padding:12px 12px 6px;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;max-width:100%}
.chart .cap{display:flex;justify-content:space-between;gap:8px;padding:0 4px 6px;flex-wrap:wrap}

.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.home{margin-top:6px;font-size:.92rem;padding:8px 10px;border-radius:8px;background:var(--accent-soft);overflow-wrap:anywhere}
.card.nurse{display:flex;flex-direction:column;gap:12px;width:100%;text-align:left;padding:16px;cursor:pointer}
.card.nurse:hover{background:var(--sunk)}
.nhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card.nurse dl{display:grid;grid-template-columns:minmax(0,8.5rem) minmax(0,1fr);gap:6px 12px;margin:0}
.card.nurse dt{font-size:.82rem;font-weight:700;color:var(--muted)}
.card.nurse dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.watch{padding:10px 12px;border-radius:12px;background:var(--accent-soft);font-size:.95rem;overflow-wrap:anywhere}
.nhead{align-items:center;flex-wrap:nowrap;justify-content:flex-start}
.cap-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cap-btn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;min-width:0;min-height:96px}
.cap-btn:hover{background:var(--sunk)}
.cap-btn i{width:10px;height:10px;border-radius:50%}
.cap-btn b{font-size:.98rem;overflow-wrap:anywhere}
.cap-btn span{font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
@media (max-width:380px){.cap-grid{grid-template-columns:1fr}.cap-btn{min-height:0;flex-direction:row;align-items:center;flex-wrap:wrap}}
.vsheet{display:flex;flex-direction:column;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;overflow-y:auto;max-height:55vh}
.vs-title{font-family:var(--display);font-weight:600;font-size:1.2rem}
.vs-sec ul{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.vs-sec li{overflow-wrap:anywhere}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px var(--accent);display:block}
.avatar img,.hero-photo img{width:100%;height:100%;object-fit:cover;display:block}
.initial{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--hero1),var(--hero2));color:var(--accent-text);font-family:var(--display);font-weight:600}
.avatar .initial{font-size:1.1rem}
.hero{flex-direction:row;align-items:center;gap:18px;flex-wrap:wrap;padding:18px;border-radius:22px;background:linear-gradient(135deg,var(--hero1),var(--hero2))}
.hero-photo{flex:none;width:112px;height:112px;border-radius:50%;overflow:hidden;border:5px solid var(--ring);box-shadow:0 6px 18px rgba(120,70,20,.18);background:var(--surface);padding:0;cursor:default}
button.hero-photo{cursor:pointer}
.hero-photo .initial{font-size:2.6rem;flex-direction:column;gap:2px}
.hero-photo .initial small{font-family:var(--body);font-size:.72rem;font-weight:700}
.hero-text{flex:1 1 180px;min-width:0;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.hero-name{font-family:var(--display);font-weight:600;font-size:2rem;line-height:1.05;overflow-wrap:anywhere}
.hero-text p{margin:0 0 6px;color:var(--muted)}
.journey-hero{padding:20px 18px;border-radius:22px;background:linear-gradient(135deg,var(--hero1),var(--hero2));gap:8px}
.journey-hero .big{font-family:var(--display);font-weight:600;font-size:2.4rem;line-height:1.05;color:var(--accent-text)}
.journey-hero p{margin:0;max-width:52ch}
.journey-hero .own{color:var(--muted)}
.jh-stats{display:flex;gap:16px;flex-wrap:wrap;font-size:.92rem}
.jh-stats b{font-family:var(--display);font-size:1.2rem;margin-right:2px}
.win-pill{align-self:flex-start;border:0;cursor:pointer;background:var(--surface);color:var(--accent-text);font-weight:700;font-size:.85rem;padding:5px 12px;border-radius:999px;margin-bottom:6px;box-shadow:0 1px 3px rgba(120,70,20,.12)}
.gain{flex:none;align-self:center;font-weight:700;font-size:.85rem;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);font-variant-numeric:tabular-nums}
.gain.up{background:var(--accent-soft);color:var(--accent-text)}
.winstar{flex:none;width:22px;height:22px;margin-top:1px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.starkey{display:inline-block;width:11px;height:11px;vertical-align:-1px;background:var(--accent);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.nightcard{display:flex;gap:12px;align-items:center;padding:14px;text-align:left;cursor:pointer;width:100%;background:var(--lav)}
.nightcard .sub{color:var(--muted);font-size:.9rem}
.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
nav.tabs button{font-size:.68rem}
.bubble{flex:none;width:38px;height:38px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.bubble svg{width:22px;height:22px}
.linkbtn{border:0;background:none;color:var(--accent-text);font-weight:700;cursor:pointer;padding:4px 0;font-size:.92rem;text-decoration:none}
.soft{box-shadow:none}
.calm{margin:0;padding:14px 16px 16px;color:var(--muted)}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:22px 18px}
.hero .deco{position:absolute;right:-8px;top:-10px;pointer-events:none;opacity:.85}
.hero .deco svg{display:block;max-width:none}
.hero-photo,.hero-text{position:relative}
.hero-age{font-weight:700;color:var(--accent-text);margin-bottom:6px}
.win-pill{display:inline-flex;align-items:center;gap:4px}
.encourage{flex-direction:row;align-items:flex-start;gap:12px;padding:16px 18px;border-radius:22px;background:linear-gradient(135deg,var(--sky),var(--lav))}
.enc-ic{flex:none;width:36px;height:36px;color:var(--accent-text);display:flex}
.enc-ic svg{width:36px;height:36px}
.enc-q{margin:0;font-family:var(--display);font-weight:500;font-size:1.15rem;line-height:1.35;text-wrap:balance}
.enc-ref{margin-top:4px;font-size:.85rem;color:var(--muted);font-weight:700}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wday{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;min-width:0}
.wday .wd{font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;max-width:100%}
.wday b{font-family:var(--display);font-weight:600;font-size:1.15rem;font-variant-numeric:tabular-nums}
.wday .dots{display:flex;gap:3px;min-height:7px}
.wday .dots i{width:6px;height:6px;border-radius:50%}
.wday[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wday[aria-pressed="true"] .wd{color:var(--accent-ink)}
.tl-list{display:flex;flex-direction:column;padding:6px 0 8px}
.tl{display:flex;align-items:flex-start;gap:12px;padding:10px 16px;border:0;background:none;text-align:left;width:100%;cursor:pointer}
.tl:hover{background:var(--sunk)}
.tl-time{flex:none;width:74px;white-space:nowrap;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums;padding-top:1px}
.tl-dot{flex:none;width:12px;height:12px;border-radius:50%;margin-top:5px}
.tl-dot.big{width:14px;height:14px;margin-top:4px}
.tl .main{flex:1;min-width:0}.tl .title{font-weight:700;overflow-wrap:anywhere}.tl .sub{color:var(--muted);font-size:.875rem;overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:420px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px;border-radius:20px;border:1px solid var(--line);background:var(--surface);text-align:left;min-width:0;cursor:pointer}
.tile:hover{background:var(--sunk)}
.tile .bubble{width:32px;height:32px;border-radius:11px;margin-bottom:4px}.tile .bubble svg{width:19px;height:19px}
.tk{font-size:.78rem;font-weight:700;color:var(--muted)}
.tv{font-family:var(--display);font-weight:600;font-size:1.2rem;line-height:1.2;overflow-wrap:anywhere}
.td{font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.bright{padding:4px 0 6px}
.bright-in{display:flex;flex-direction:column;gap:6px;padding:12px 16px 4px}
.bright-in label{font-weight:700;font-size:.9rem}
.bright-row{display:flex;gap:8px}
.bright-row input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:9px 14px;min-height:42px}
.bright-list{display:flex;flex-direction:column;padding:6px 0}
.bright-item{display:flex;gap:12px;align-items:flex-start;padding:10px 16px;border:0;background:none;text-align:left;width:100%;cursor:pointer}
.bright-item:hover{background:var(--sunk)}
.bright-item .main{flex:1;min-width:0}.bright-item .title{font-weight:700;overflow-wrap:anywhere}.bright-item .sub{color:var(--muted);font-size:.85rem}
.moment{padding:18px;border-radius:22px;background:var(--lav);gap:6px}
.moment p{margin:0;max-width:52ch}.moment .m-big{font-family:var(--display);font-weight:500;font-size:1.15rem}
.moment .small{color:var(--muted)}
.team-intro p{margin:0;color:var(--muted);font-size:1.02rem}
.add-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:380px){.add-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.add-tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.8rem;font-weight:700;min-width:0;text-align:center}
.add-tile:hover{background:var(--sunk)}
.add-tile span{overflow-wrap:anywhere}
.fab{position:fixed;z-index:7;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(78px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 22px rgba(170,100,20,.35);cursor:pointer;display:flex;align-items:center;justify-content:center}
.fab svg{width:30px;height:30px;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;fill:none}
@media (prefers-reduced-motion:no-preference){.fab:active{transform:scale(.94)}}
.series{display:flex;gap:12px;align-items:flex-start;padding:14px 16px}
.series .main{flex:1;min-width:0}.series .sub{color:var(--muted);font-size:.9rem}
.confetti{position:fixed;inset:0;z-index:30;pointer-events:none}
main.band .inner{gap:26px}
.banner{padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-size:.92rem}
.progressbar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.progressbar span{display:block;height:100%;background:var(--ok);border-radius:99px}
.sources{font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.sources a{color:var(--accent-text)}
.phone{font-variant-numeric:tabular-nums;user-select:all}
.foot{font-size:.82rem;color:var(--muted);text-align:center;max-width:52ch;margin:0 auto}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
nav.tabs button{flex:1;max-width:128px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;color:var(--muted);font-size:.72rem;font-weight:700;cursor:pointer}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent-text)}
nav.tabs button[aria-current="page"] svg{fill:var(--accent-soft)}

dialog.sheet{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(560px,100%);max-width:100%;max-height:90vh;border-radius:18px 18px 0 0;margin:auto auto 0;box-shadow:0 -6px 30px rgba(0,0,0,.25)}
@media (min-width:600px){dialog.sheet{border-radius:18px;margin:auto}}
dialog.sheet::backdrop{background:rgba(10,20,28,.45)}
.sheet form{display:flex;flex-direction:column;gap:14px;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-head h3{font-family:var(--display);font-weight:600;font-size:1.25rem}
.fields{display:flex;flex-wrap:wrap;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 100%;min-width:0}
.field.half{flex:1 1 calc(50% - 6px)}
.field label{font-size:.82rem;font-weight:700;color:var(--muted)}
.field.checkrow{flex-direction:row;align-items:center;gap:10px}
.field.checkrow input{width:22px;height:22px;accent-color:var(--accent-text)}
.field input:not([type=checkbox]),.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px}
.field textarea{resize:vertical}
.sheet-actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.sheet-actions .right{display:flex;gap:10px;margin-left:auto}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}}
</style>

<script>
/* ---------- helpers ---------- */
const $=(s,el=document)=>el.querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v)}for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;e.append(c instanceof Node?c:document.createTextNode(String(c)))}return e}
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const parseYmd=s=>{const[y,m,d]=(s||today()).split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const fmtDate=(s,o)=>parseYmd(s).toLocaleDateString(undefined,o||{weekday:'short',month:'short',day:'numeric'});
const fmtTime=t=>{if(!t)return'';const[H,M]=t.split(':').map(Number);return`${(H%12)||12}:${pad(M)} ${H>=12?'PM':'AM'}`};
const nowTime=()=>{const d=new Date();return`${pad(d.getHours())}:${pad(d.getMinutes())}`};
const strip=r=>{const o={...r};delete o.id;return o};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function toast(msg){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=h('div',{class:'toast',role:'status',text:msg});document.body.append(t);setTimeout(()=>t.remove(),2400)}
function ago(dateStr,time){if(!time)return'';const[H,M]=time.split(':').map(Number);const d=parseYmd(dateStr);d.setHours(H,M);const m=Math.round((Date.now()-d)/60000);if(m<0)return'';if(m<60)return`${m} min ago`;const hr=Math.floor(m/60);if(hr<24)return`${hr}h ${m%60}m ago`;return`${Math.floor(hr/24)}d ago`}

/* ---------- config ---------- */
const APPT_KINDS=['Primary care','Cardiology','GI','Advanced feeding','Ophthalmology','Other specialist','Physical therapy','Occupational therapy','Speech therapy','In-home nurse','Lab or test','Other'];
const KIND_COLOR={'Primary care':'--accent','Cardiology':'--weight','GI':'--feed','Advanced feeding':'--feed','Ophthalmology':'--sleep','Other specialist':'--weight','Physical therapy':'--exercise','Occupational therapy':'--diaper','Speech therapy':'--sleep','In-home nurse':'--nurse','Lab or test':'--note','Other':'--note'};
const LOG={
  feed:{label:'Meal',color:'--feed',fields:()=>[{k:'amount',label:'Amount',type:'number',step:'0.5',half:true},{k:'unit',label:'Unit',type:'select',options:['oz','ml'],def:unitPref,half:true},{k:'method',label:'How he ate',type:'select',options:['Bottle','Tube, bolus','Tube, pump','Bottle, then tube','Breast','Other']},{k:'note',label:'Notes',type:'textarea',ph:'Spit up, fussy, took it well'}],
    line:e=>[e.amount?`${e.amount} ${e.unit||''}`:'',e.method].filter(Boolean).join(' · ')},
  nightfeed:{label:'Night feed',color:'--sleep',fields:()=>[
    {k:'end',label:'Ended',type:'time',half:true},{k:'rate',label:'Pump rate, ml per hour',type:'number',half:true},
    {k:'total',label:'Total given',type:'number',half:true},{k:'unit',label:'Unit',type:'select',options:['ml','oz'],def:'ml',half:true},
    {k:'formula',label:'Formula or milk',ph:'Breast milk, formula name, calories'},
    {k:'went',label:'How the night went',type:'select',options:['Went well','Some spit up','Vomited','Pump alarm or stopped','Tube came out','Other']},
    {k:'note',label:'Notes',type:'textarea',ph:'Flushes, venting, anything for the morning'}],
    line:e=>[e.total?`${e.total} ${e.unit||'ml'}`:'',e.time&&e.end?`${fmtTime(e.time)} to ${fmtTime(e.end)}`:'',e.rate?`${e.rate} ml/hr`:'',e.went].filter(Boolean).join(' · ')},
  diaper:{label:'Diaper',color:'--diaper',fields:()=>[{k:'kind',label:'Type',type:'select',options:['Wet','Dirty','Both']},{k:'note',label:'Notes'}],line:e=>e.kind||''},
  sleep:{label:'Nap',color:'--sleep',fields:()=>[{k:'hours',label:'How long, in hours',type:'number',step:'0.25'},{k:'note',label:'Notes'}],line:e=>e.hours?`${e.hours} h`:''},
  exercise:{label:'Playtime',color:'--exercise',fields:()=>[{k:'what',label:'What you practiced or played',list:()=>S.plan.filter(p=>p.active!==false).map(p=>p.instruction),ph:'Tummy time, reaching for toys'},{k:'minutes',label:'Minutes',type:'number'},{k:'note',label:'How he did',type:'textarea'}],line:e=>[e.what,e.minutes?`${e.minutes} min`:''].filter(Boolean).join(' · ')},
  weight:{label:'Weigh in',color:'--weight',fields:()=>[{k:'lb',label:'Pounds',type:'number',half:true},{k:'oz',label:'Ounces',type:'number',step:'0.1',half:true},{k:'length',label:'Length, inches',type:'number',step:'0.1',half:true},{k:'head',label:'Head, inches',type:'number',step:'0.1',half:true},{k:'note',label:'Where it was taken',ph:'Pediatrician, home scale'}],line:e=>[fmtWeight(totOz(e)),e.length?e.length+' in long':''].filter(Boolean).join(' · ')},
  med:{label:'Medicine',color:'--med',fields:()=>[{k:'name',label:'Medicine',list:()=>S.meds.map(m=>m.name)},{k:'dose',label:'Dose given'},{k:'note',label:'Notes'}],line:e=>[e.name,e.dose].filter(Boolean).join(' · ')},
  nurse:{label:'Nurse note',color:'--nurse',fields:()=>[
    {k:'nurse',label:'Nurse name',list:()=>S.team.map(t=>t.name)},
    {k:'intake',label:'Ate and drank, total',type:'number',step:'0.5',half:true},{k:'unit',label:'Unit',type:'select',options:['oz','ml'],def:unitPref,half:true},
    {k:'feeds',label:'Meals',type:'textarea',rows:2,ph:'Times, amounts, how he took them'},
    {k:'wet',label:'Wet diapers',type:'number',half:true},{k:'dirty',label:'Dirty diapers',type:'number',half:true},
    {k:'vitals',label:'How he is doing',ph:'Weight, temperature, oxygen'},
    {k:'activity',label:'Practice and play',type:'textarea',rows:2},
    {k:'concerns',label:'Keep an eye on',type:'textarea',rows:2},
    {k:'text',label:'Full report',type:'textarea',rows:4,ph:'The whole message, word for word'}],
    line:e=>[e.intake?`Took in ${e.intake} ${e.unit||''}`:'',e.concerns?'Keep an eye on: '+e.concerns:'',!e.intake&&!e.concerns?(e.feeds||e.text||''):''].filter(Boolean).join(' · ')},
  note:{label:'Note',color:'--note',fields:()=>[{k:'text',label:'Note',type:'textarea',rows:4}],line:e=>e.text||''}
};
const CFG={
  appts:{title:'Visit',fields:()=>[
    {k:'kind',label:'Type',type:'select',options:APPT_KINDS},
    {k:'title',label:'What is it',ph:'Feeding evaluation'},
    {k:'provider',label:'Provider',list:()=>S.team.map(t=>t.name)},
    {k:'date',label:'Date',type:'date',def:today,half:true,req:true},
    {k:'time',label:'Time',type:'time',half:true},
    {k:'location',label:'Location'},
    {k:'who',label:'Who is going'},
    {k:'bring',label:'What to bring',ph:'Insurance card, med list, diapers, bottle'},
    {k:'notes',label:'Before the visit',type:'textarea',rows:2,ph:'Questions to ask, paperwork'},
    {k:'summary',label:'What happened at the visit',type:'textarea',rows:4,ph:'Weight, what they checked, what they said'},
    {k:'homework',label:'What we need to do at home',type:'textarea',rows:3,ph:'Exercises, feeding changes, next appointment'},
    {k:'repeat',label:'Repeat',type:'select',newOnly:true,options:[['1','Does not repeat'],['4','Weekly for 4 weeks'],['8','Weekly for 8 weeks'],['12','Weekly for 12 weeks']]}
  ]},
  plan:{title:'Practice at home',fields:()=>[
    {k:'instruction',label:'What to practice',type:'textarea',req:true,ph:'Tummy time 3 times a day, 5 minutes each'},
    {k:'provider',label:'Who asked for it',list:()=>S.team.map(t=>t.name),half:true},
    {k:'frequency',label:'How often',type:'select',options:['Every day','Several times a day','A few times a week','Weekly','As needed'],half:true},
    {k:'since',label:'Started',type:'date',def:today,half:true},
    {k:'active',label:'Still doing this',type:'checkbox',def:true}
  ]},
  meds:{title:'Medicine',fields:()=>[
    {k:'name',label:'Medicine',req:true},
    {k:'dose',label:'Dose',half:true},{k:'when',label:'When to give',half:true,ph:'8 AM and 8 PM'},
    {k:'prescriber',label:'Prescribed by',list:()=>S.team.map(t=>t.name)},
    {k:'pharmacy',label:'Pharmacy'},
    {k:'notes',label:'Notes',type:'textarea',ph:'How to measure, side effects to watch'}
  ]},
  team:{title:'Helper',fields:()=>[
    {k:'name',label:'Name',req:true},
    {k:'role',label:'Role',list:()=>['Pediatrician','Cardiologist','Pulmonologist','Physical therapist','Occupational therapist','Home health nurse','Nurse case manager','Pharmacy','Developmental clinic']},
    {k:'phone',label:'Phone',type:'tel'},
    {k:'notes',label:'Notes',type:'textarea',ph:'Office hours, after hours line, portal'}
  ]},
  wins:{title:'Win',fields:()=>[
    {k:'title',label:'What happened',req:true,ph:'Took a whole bottle by mouth'},
    {k:'date',label:'Date',type:'date',def:today,half:true,req:true},
    {k:'category',label:'Kind of win',type:'select',half:true,options:['A first','Bright spot','Feeding','Growing','Moving','Sounds and talking','Health','Just because']},
    {k:'note',label:'The story',type:'textarea',ph:'Who saw it, how it felt'}
  ]},
  questions:{title:'Question',fields:()=>[
    {k:'text',label:'Question',type:'textarea',req:true},
    {k:'for',label:'For',list:()=>S.team.map(t=>t.name)},
    {k:'done',label:'Asked and answered',type:'checkbox',def:false},
    {k:'answer',label:'What they said',type:'textarea'}
  ]}
};
const CHECKLIST=[
  {group:'Before leaving the hospital',items:[
    ['c1','Attend the NICU discharge and infant CPR classes','Ask which classes are required before discharge.'],
    ['c2','Practice his care with the nurses','Feeding, medicines, any tube or equipment. Some families stay a night or two to practice.'],
    ['c3','Get the After Visit Summary','The nurse case manager writes this home care plan. Add each instruction to the Care plan tab.'],
    ['c4','Get the current medicine list','Ask what each new medicine is for, then fill prescriptions before going home.'],
    ['c5','Know who his doctors will be','Confirm the pediatrician and every specialist who will follow him.'],
    ['c6','Ask about follow up clinics','Ask if he should be seen at a developmental follow up clinic.'],
    ['c7','Arrange home health and equipment','Nurse visits, supplies and equipment should be set up before discharge.'],
    ['c8','Install the car seat','Bring the car seat and clothes for the ride home.']
  ]},
  {group:'Once he is home',items:[
    ['h1','Add every follow up appointment','Put them on the Schedule tab so everyone can see them.'],
    ['h2','Reread the label before each dose','Give each medicine exactly as prescribed, and use one pharmacy.'],
    ['h3','Ask the pharmacist how to measure doses','Also ask about side effects, and question any refill that looks different.'],
    ['h4','Write down home exercises','Therapists and clinic staff share activities to do at home. Log them daily.'],
    ['h5','Keep a steady daily routine','Consistent sleep and feeding times help babies settle at home.'],
    ['h6','Keep a list of questions','Add them on the Today tab and bring it to each visit.'],
    ['h7','Take care of the caregivers','NICU parents carry a lot. Talk to a doctor if worry or sadness does not ease.']
  ]}
];

/* ---------- state ---------- */
const COLLS=['appts','logs','plan','meds','questions','team','wins'];
const S={appts:[],logs:[],plan:[],meds:[],questions:[],team:[],wins:[],profile:{},checklist:{},daily:{}};
let db=null,user=null,myId=null,canWrite=true,status='loading';
let tab=store.get('tab')||'today',schedMode='upcoming',logMode='day',logDate=today();
const unitPref=()=>S.profile.feedUnit||'oz';
const totOz=e=>(Number(e.lb)||0)*16+(Number(e.oz)||0);
const fmtWeight=oz=>{if(!oz)return'';const lb=Math.floor(oz/16);const r=Math.round((oz-lb*16)*10)/10;return`${lb} lb ${r} oz`};
const toPref=(amt,unit)=>{amt=Number(amt)||0;const p=unitPref();if(!unit||unit===p)return amt;return p==='ml'?amt*29.5735:amt/29.5735};
const fmtAmt=v=>unitPref()==='ml'?`${Math.round(v)} ml`:`${Math.round(v*2)/2} oz`;
const sortLogs=a=>[...a].sort((x,y)=>(y.date+(y.time||'')).localeCompare(x.date+(x.time||'')));
const apptKey=a=>a.date+(a.time||'99:99');
const nurseIntake=d=>S.logs.filter(l=>l.date===d&&l.type==='nurse'&&l.intake).reduce((m,l)=>Math.max(m,toPref(l.intake,l.unit)),0);
let sampleFn=null,sampleImages=false,schedKind='';
const feedSum=d=>S.logs.filter(l=>l.date===d&&(l.type==='feed'||l.type==='nightfeed')).reduce((s,f)=>s+(f.type==='nightfeed'?toPref(f.total,f.unit||'ml'):toPref(f.amount,f.unit)),0);
const feedTotal=d=>feedSum(d)||nurseIntake(d);
const weights=()=>S.logs.filter(l=>l.type==='weight'&&totOz(l)>0).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
const fmtGain=oz=>{const a=Math.abs(oz);const lb=Math.floor(a/16),r=Math.round((a-lb*16)*10)/10;return((lb?`${lb} lb `:'')+(r||!lb?`${r} oz`:'')).trim()};
const lastNightFeed=d=>sortLogs(S.logs.filter(l=>l.type==='nightfeed'&&(l.date===d||l.date===addDays(d,-1))))[0];

/* ---------- data writes ---------- */
function errMsg(e){const c=e&&e.code;if(c==='invalid_argument')return'You can view this tracker but not change it. Ask the owner to invite you as an Editor.';if(c==='quota_exceeded')return'Storage is full. Delete some old entries and try again.';if(c==='resource_exhausted')return'Too many changes at once. Wait a moment and try again.';return'Could not save. Check your connection and try again.'}
async function add(coll,data){if(!db){toast('Sign in to claude.ai to save');return false}try{await db.collection(coll).add({...data,createdBy:myId,createdAt:Date.now()});return true}catch(e){toast(errMsg(e));return false}}
async function put(coll,id,data){if(!db)return false;try{await db.collection(coll).doc(id).set({...data,updatedBy:myId,updatedAt:Date.now()});return true}catch(e){toast(errMsg(e));return false}}
async function del(coll,id){if(!db)return false;try{await db.collection(coll).doc(id).delete();toast('Deleted');return true}catch(e){toast(errMsg(e));return false}}

/* ---------- form sheet ---------- */
function openForm({title,fields,values={},onSave,onDelete,extra}){
  const dlg=$('#sheet'),form=$('#sheetForm');form.replaceChildren();
  const box=h('div',{class:'fields'});
  fields.forEach(f=>{
    const id='f_'+f.k;let val=values[f.k];if(val===undefined)val=typeof f.def==='function'?f.def():f.def;if(val==null)val='';
    let input;
    if(f.type==='select'){input=h('select',{id,name:f.k},f.options.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return h('option',{value:v},l)}));if(val!=='')input.value=val}
    else if(f.type==='textarea'){input=h('textarea',{id,name:f.k,rows:f.rows||3,placeholder:f.ph||null});input.value=val}
    else if(f.type==='checkbox'){input=h('input',{id,name:f.k,type:'checkbox'});input.checked=!!val;box.append(h('div',{class:'field checkrow'},input,h('label',{for:id,text:f.label})));return}
    else{input=h('input',{id,name:f.k,type:f.type||'text',placeholder:f.ph||null,step:f.step||null,inputmode:f.type==='number'?'decimal':null,list:f.list?id+'_l':null,autocomplete:'off'});input.value=val}
    const dl=f.list?h('datalist',{id:id+'_l'},[...new Set(f.list().filter(Boolean))].map(o=>h('option',{value:o}))):null;
    box.append(h('div',{class:'field'+(f.half?' half':'')},h('label',{for:id,text:f.label+(f.req?' *':'')}),input,dl));
  });
  let armed=false;
  const delBtn=onDelete?h('button',{type:'button',class:'btn danger',onclick:async e=>{if(!armed){armed=true;e.currentTarget.classList.add('armed');e.currentTarget.textContent='Tap again to delete';return}if(await onDelete())dlg.close()}},'Delete'):null;
  form.append(
    h('div',{class:'sheet-head'},h('h3',{text:title}),h('button',{type:'button',class:'icon-btn','aria-label':'Close',onclick:()=>dlg.close()},'×')),
    box,
    h('div',{class:'sheet-actions'},delBtn,extra||null,h('div',{class:'right'},h('button',{type:'button',class:'btn',onclick:()=>dlg.close()},'Cancel'),h('button',{type:'submit',class:'btn primary',id:'saveBtn'},'Save')))
  );
  form.onsubmit=async ev=>{
    ev.preventDefault();const v={};
    for(const f of fields){const el=form.elements[f.k];if(!el)continue;if(f.type==='checkbox')v[f.k]=el.checked;else if(f.type==='number')v[f.k]=el.value===''?null:Number(el.value);else v[f.k]=el.value.trim();
      if(f.req&&(v[f.k]===''||v[f.k]==null)){toast(`Please fill in ${f.label.toLowerCase()}`);el.focus();return}}
    const b=$('#saveBtn');b.disabled=true;b.textContent='Saving';
    const ok=await onSave(v);b.disabled=false;b.textContent='Save';
    if(ok){dlg.close();toast('Saved')}
  };
  if(!canWrite){form.querySelectorAll('input,select,textarea').forEach(x=>x.disabled=true);$('#saveBtn').hidden=true;if(delBtn)delBtn.hidden=true}
  dlg.showModal();
  const first=form.querySelector('.fields input:not([type=checkbox]),.fields textarea');if(first&&!values.id&&first.type!=='date')setTimeout(()=>first.focus(),50);
}
function editRec(coll,rec,prefill,after){
  const cfg=CFG[coll];const fields=cfg.fields().filter(f=>!((rec||prefill)&&f.newOnly));
  const extra=coll==='appts'&&rec&&rec.date>=today()?h('button',{type:'button',class:'btn',onclick:()=>{$('#sheet').close();openVisitSheet(rec)}},'Visit sheet'):null;
  openForm({title:prefill?'Check it, then save':rec?cfg.title:'New '+cfg.title.toLowerCase(),fields,values:{...(rec||{}),...(prefill||{})},extra,
    onSave:async v=>{
      let ok;
      if(rec)ok=await put(coll,rec.id,{...strip(rec),...v});
      else{const n=Number(v.repeat||1);delete v.repeat;ok=true;
        for(let i=0;i<n;i++){if(!await add(coll,{...v,date:v.date&&i?addDays(v.date,7*i):v.date})){ok=false;break}}}
      if(ok&&after)setTimeout(()=>after(v),300);
      return ok},
    onDelete:rec?()=>del(coll,rec.id):null});
}

  const onErr=e=>{if(e&&e.code==='revoked'){status='nodb'}render()};
  COLLS.forEach(k=>db.collection(k).onSnapshot(s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));render()},onErr));
  db.doc('meta/profile').onSnapshot(s=>{S.profileExists=s.exists;S.profile=s.exists?s.data():{};render()},onErr);
  db.doc('meta/checklist').onSnapshot(s=>{S.checklist=s.exists?(s.data().checked||{}):{};render()},onErr);
  subDaily();
  const tick=()=>{if(today()!==dailyDate){subDaily();logDate=today();homeDay=today();render()}};
  setInterval(tick,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();render()}});
  render();
}
boot();
</script>

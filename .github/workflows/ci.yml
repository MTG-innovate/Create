name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec next typegen
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-only-placeholder

  database:
    name: Family separation, access and end-to-end tests (real Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Start Supabase (applies migrations and the demo seed)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Database tests
        run: pnpm test:db
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Build and start the app against local Supabase
        run: |
          eval "$(supabase status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}"
          export NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000
          pnpm build
          nohup pnpm start -H 127.0.0.1 -p 3000 > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/sign-in > /dev/null && break; sleep 1; done
      - run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
      - name: Keep screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-results/
            next.log
          if-no-files-found: ignore
